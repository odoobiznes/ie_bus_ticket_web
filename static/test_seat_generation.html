<!DOCTYPE html>
<html>
<head>
    <title>Test Seat Generation</title>
    <style>
        .bus-layout {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #dee2e6;
        }
        
        .seat-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .seat {
            width: 50px;
            height: 50px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        
        .seat.available {
            background: #d4edda;
            border-color: #c3e6cb;
        }
        
        .seat.available:hover {
            background: #b1dfbb;
            transform: scale(1.05);
        }
        
        .seat.aisle {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <h1>Test Seat Generation</h1>
    <div id="seatConfig" data-rows="10" data-cols="4" data-layout="2-2"></div>
    <div class="bus-layout" id="busLayout">
        <!-- Seats will be generated here -->
    </div>
    
    <script>
        console.log('Starting seat generation test...');
        
        function createSeat(row, col) {
            var seatId = row + '_' + col;
            var seat = document.createElement('div');
            seat.className = 'seat available';
            seat.id = 'seat_' + seatId;
            seat.textContent = row + String.fromCharCode(64 + col);
            seat.onclick = function() { 
                console.log('Clicked seat:', seatId);
                seat.classList.toggle('available');
            };
            return seat;
        }
        
        function initializeSeatLayout() {
            console.log('initializeSeatLayout called');
            
            var busLayout = document.getElementById('busLayout');
            if (!busLayout) {
                console.error('busLayout element not found!');
                return;
            }
            
            var cfg = document.getElementById('seatConfig');
            if (!cfg) {
                console.error('seatConfig element not found!');
                return;
            }
            
            var rows = parseInt(cfg.dataset.rows || '10', 10);
            var layout = cfg.dataset.layout || '2-2';
            
            console.log('Generating seats - rows:', rows, 'layout:', layout);
            
            busLayout.innerHTML = '';
            
            for (var row = 1; row <= rows; row++) {
                var rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                
                // Generate 2-2 layout
                // Left side seats (2 seats)
                for (var i = 1; i <= 2; i++) {
                    var seat = createSeat(row, i);
                    rowDiv.appendChild(seat);
                }
                
                // Aisle
                var aisle = document.createElement('div');
                aisle.className = 'seat aisle';
                rowDiv.appendChild(aisle);
                
                // Right side seats (2 seats)
                for (var i = 3; i <= 4; i++) {
                    var seat = createSeat(row, i);
                    rowDiv.appendChild(seat);
                }
                
                busLayout.appendChild(rowDiv);
            }
            
            console.log('Seats generated. Rows added:', busLayout.children.length);
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSeatLayout);
        } else {
            initializeSeatLayout();
        }
    </script>
</body>
</html>
